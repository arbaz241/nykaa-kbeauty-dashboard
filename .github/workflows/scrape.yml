name: Daily Nykaa scrape
# the guard counts only runs titled "Daily Nykaa scrape": dry runs write nothing and partial runs only repair
run-name: ${{ inputs.mode == 'dry-run' && 'Nykaa scrape (dry run)' || inputs.categories != '' && 'Nykaa scrape (some categories)' || 'Daily Nykaa scrape' }}

on:
  schedule:
    # 00:05 UTC = 09:05 KST, the time the Mac ran it from 24 Oct to 26 Nov (owner 26 Nov 2026: back on GitHub).
    # The job itself adds up to 15 min of random jitter. GitHub's scheduler is best effort (on 12 Oct it started six
    # hours late), so a scheduled run that starts after 03:30 UTC stands down and leaves the day to the Mac backup
    # (13:35 KST, first week of the switch; it stands down too when today already has data).
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = scrape + enrich + ingest to Supabase; dry-run = listings only, no DB (Akamai/IP test)"
        type: choice
        default: full
        options: [full, dry-run]
      categories:
        description: "comma-separated category keys (blank = all)"
        required: false
        default: ""
      force:
        description: "run even if today already has a full run (a full run normally stands down)"
        type: boolean
        default: false

concurrency:
  group: nykaa-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # One full run per UTC day, scheduled or manual: a full run goes ahead only when today has no other full run
      # (in progress, queued or finished; cancelled ones don't count). Dry runs, partial runs and "force" always go
      # ahead. A failed run is not retried: that needs a look first.
      - name: Check for an earlier run today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "dry-run" ] || [ -n "${{ inputs.categories }}" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "dry run, partial run or forced: going ahead"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H%M)" -gt 0330 ]; then
            echo "scheduled run started after 03:30 UTC: standing down (the Mac backup covers today)"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Today's shelf rankings may come from another runner (the Mac): one run per day whoever ran it
          d=$(curl -s "$SUPABASE_URL/rest/v1/scrape_snapshots?select=product_id&scrape_date=eq.$today&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          case "$d" in
            "[]") ;;
            "["*) echo "today already has shelf rankings: standing down"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) echo "could not check today's data ($d): not running"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 1 ;;
          esac
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/scrape.yml/runs?created=%3E%3D${today}&per_page=50" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }} and .conclusion != "cancelled" and .display_title == "Daily Nykaa scrape")] | length')
          echo "full runs today besides this one: $n"
          if [ "$n" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  scrape:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # About an hour a day (told GitHub support, Oct 2026, after the account was flagged for a 4.5-hour run): never
    # schedule multi-hour jobs here. 2.5 hours is the hard stop when Nykaa is slow.
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPE_RUNNER: github-actions
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # first_review_date cache: restore from the previous run so we don't
      # re-fetch dates we already know. Keyed per run so it is always re-saved.
      - name: Restore review cache
        uses: actions/cache/restore@v6
        with:
          path: data/cache
          key: review-cache-${{ github.run_id }}
          restore-keys: review-cache-

      - name: Run scraper
        id: run
        env:
          # jitter only on the schedule, not on manual runs; 0-15 min
          SCRAPE_START_JITTER_SEC: ${{ github.event_name == 'schedule' && '900' || '0' }}
          # Same settings as the Mac run (24 Oct-26 Nov). 8-12 s between list pages (owner 5 Nov: "too many requests"
          # rose 14 -> 75 -> 108 on 3-5 Nov); review pages 3 s apart; no wide review pass on the daily run.
          SCRAPE_MIN_DELAY_SEC: "8"
          SCRAPE_MAX_DELAY_SEC: "12"
          REVIEW_HISTORY_MAX_MINUTES: "10"
          REVIEW_HISTORY_MAX_PRODUCTS_PER_RUN: "40"
          ENRICH_DELAY_SEC: "3"
          REVIEW_TEXT_MAX_MINUTES: "0"
          REVIEW_WIDE_MAX_MINUTES: "0"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then ARGS="--no-db --no-enrich"; fi
          if [ -n "${{ github.event.inputs.categories }}" ]; then ARGS="$ARGS --categories ${{ github.event.inputs.categories }}"; fi
          echo "args: $ARGS"
          python -m scraper.run $ARGS

      # The dashboard reads ready-made copies of its views (migration 020): rebuild them from whatever tonight
      # wrote, even when a step above failed part-way.
      - name: Refresh dashboard copies
        if: always() && steps.run.outcome != 'skipped' && github.event.inputs.mode != 'dry-run'
        run: python -m scraper.refresh

      # Fails the job (so GitHub emails the owner) when a dataset did not advance tonight, even if every
      # step above passed: a collector can fail quietly, and a day Nykaa is not read is lost for good.
      - name: Check data freshness
        if: always() && github.event.inputs.mode != 'dry-run' && github.event.inputs.categories == ''
        run: python -m scraper.freshness

      - name: Save review cache
        if: always() && hashFiles('data/cache/**') != ''
        uses: actions/cache/save@v6
        with:
          path: data/cache
          key: review-cache-${{ github.run_id }}

      # No "upload run output" step (removed 20 Oct 2026 before the repo goes public): on a public repo anyone could
      # download a run's data/ folder, and the owner's rule is no data as public files. Everything the run collects is
      # in Supabase; a failed ingest is re-read the next night.

name: Daily Nykaa scrape

on:
  schedule:
    # 01:30 UTC = 07:00 IST. The job itself adds up to 30 min of random jitter.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = scrape + enrich + ingest to Supabase; dry-run = listings only, no DB (Akamai/IP test)"
        type: choice
        default: full
        options: [full, dry-run]
      categories:
        description: "comma-separated category keys (blank = all)"
        required: false
        default: ""

concurrency:
  group: nykaa-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 80   # review crawl is time-boxed to ~36 min of this; Nykaa throttles hard
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPE_RUNNER: github-actions
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # first_review_date cache: restore from the previous run so we don't
      # re-fetch dates we already know. Keyed per run so it is always re-saved.
      - name: Restore review cache
        uses: actions/cache/restore@v6
        with:
          path: data/cache
          key: review-cache-${{ github.run_id }}
          restore-keys: review-cache-

      - name: Run scraper
        id: run
        env:
          # jitter only on the schedule, not on manual runs; 0-15 min (cut from 30 on 5 Oct: the sleep is billed
          # against the private repo's 2,000 free Actions minutes and runs were nearing ~1,850/month)
          SCRAPE_START_JITTER_SEC: ${{ github.event_name == 'schedule' && '900' || '0' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then ARGS="--no-db --no-enrich"; fi
          if [ -n "${{ github.event.inputs.categories }}" ]; then ARGS="$ARGS --categories ${{ github.event.inputs.categories }}"; fi
          echo "args: $ARGS"
          python -m scraper.run $ARGS

      # Fails the job (so GitHub emails the owner) when a dataset did not advance tonight, even if every
      # step above passed: a collector can fail quietly, and a day Nykaa is not read is lost for good.
      - name: Check data freshness
        if: always() && github.event.inputs.mode != 'dry-run' && github.event.inputs.categories == ''
        run: python -m scraper.freshness

      - name: Save review cache
        if: always() && hashFiles('data/cache/**') != ''
        uses: actions/cache/save@v6
        with:
          path: data/cache
          key: review-cache-${{ github.run_id }}

      # Raw output for inspection / recovery if the DB ingest fails.
      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scrape-${{ github.run_id }}
          path: data/
          retention-days: 14
          if-no-files-found: warn

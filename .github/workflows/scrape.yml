name: Daily Nykaa scrape
# the guard counts only runs titled "Daily Nykaa scrape": dry runs write nothing and partial runs only repair
run-name: ${{ inputs.mode == 'dry-run' && 'Nykaa scrape (dry run)' || inputs.categories != '' && 'Nykaa scrape (some categories)' || 'Daily Nykaa scrape' }}

on:
  schedule:
    # 01:30 UTC = 07:00 IST. The job itself adds up to 15 min of random jitter.
    - cron: "30 1 * * *"
    # Backup: GitHub's scheduler is best effort; on 12 Oct it started the 01:30 run six hours late (07:39). Both
    # schedules pass the guard job below, which starts the scrape only if today has no run yet (~1 min otherwise),
    # so whichever arrives first scrapes and a late one stands down.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = scrape + enrich + ingest to Supabase; dry-run = listings only, no DB (Akamai/IP test)"
        type: choice
        default: full
        options: [full, dry-run]
      categories:
        description: "comma-separated category keys (blank = all)"
        required: false
        default: ""
      force:
        description: "run even if today already has a full run (a full run normally stands down)"
        type: boolean
        default: false

concurrency:
  group: nykaa-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # One full run per UTC day, scheduled or manual: a full run goes ahead only when today has no other full run
      # (in progress, queued or finished; cancelled ones don't count). Dry runs, partial runs and "force" always go
      # ahead. A failed run is not retried: that needs a look first.
      - name: Check for an earlier run today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.mode }}" = "dry-run" ] || [ -n "${{ inputs.categories }}" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "dry run, partial run or forced: going ahead"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today=$(date -u +%F)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/scrape.yml/runs?created=%3E%3D${today}&per_page=50" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }} and .conclusion != "cancelled" and .display_title == "Daily Nykaa scrape")] | length')
          echo "full runs today besides this one: $n"
          if [ "$n" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  scrape:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100  # time-boxed steps: reviews ~36 + top-30 reviews 15 + review counts 15 min; Nykaa throttles hard
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPE_RUNNER: github-actions
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # first_review_date cache: restore from the previous run so we don't
      # re-fetch dates we already know. Keyed per run so it is always re-saved.
      - name: Restore review cache
        uses: actions/cache/restore@v6
        with:
          path: data/cache
          key: review-cache-${{ github.run_id }}
          restore-keys: review-cache-

      - name: Run scraper
        id: run
        env:
          # jitter only on the schedule, not on manual runs; 0-15 min (cut from 30 on 5 Oct: the sleep is billed
          # against the private repo's 2,000 free Actions minutes and runs were nearing ~1,850/month)
          SCRAPE_START_JITTER_SEC: ${{ github.event_name == 'schedule' && '900' || '0' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then ARGS="--no-db --no-enrich"; fi
          if [ -n "${{ github.event.inputs.categories }}" ]; then ARGS="$ARGS --categories ${{ github.event.inputs.categories }}"; fi
          echo "args: $ARGS"
          python -m scraper.run $ARGS

      # The dashboard reads ready-made copies of its views (migration 020): rebuild them from whatever tonight
      # wrote, even when a step above failed part-way.
      - name: Refresh dashboard copies
        if: always() && steps.run.outcome != 'skipped' && github.event.inputs.mode != 'dry-run'
        run: python -m scraper.refresh

      # Fails the job (so GitHub emails the owner) when a dataset did not advance tonight, even if every
      # step above passed: a collector can fail quietly, and a day Nykaa is not read is lost for good.
      - name: Check data freshness
        if: always() && github.event.inputs.mode != 'dry-run' && github.event.inputs.categories == ''
        run: python -m scraper.freshness

      - name: Save review cache
        if: always() && hashFiles('data/cache/**') != ''
        uses: actions/cache/save@v6
        with:
          path: data/cache
          key: review-cache-${{ github.run_id }}

      # Raw output for inspection / recovery if the DB ingest fails.
      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scrape-${{ github.run_id }}
          path: data/
          retention-days: 14
          if-no-files-found: warn
